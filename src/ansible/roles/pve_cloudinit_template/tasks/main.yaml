---
- name: "CloudInit: Fetch checksums manifest for upstream image"
  ansible.builtin.uri:
    url: "{{ template_upstream_base_url }}/SHA512SUMS"
    return_content: true
  register: upstream_checksums

- name: "CloudInit: Parse upstream SHA-512 hash in memory"
  ansible.builtin.set_fact:
    upstream_sha512: "{{ (upstream_checksums.content | regex_findall('([a-f0-9]{128})\\s+' + template_upstream_filename) + ['upstream_parse_error']) | first }}"

- name: "CloudInit: Check if template VM (ID: {{ template_vmid }}) exists"
  ansible.builtin.command: qm status {{ template_vmid }}
  register: template_status
  failed_when: false
  changed_when: false

- name: "CloudInit: Retrieve existing template configuration"
  ansible.builtin.command: qm config {{ template_vmid }}
  register: template_config
  when: template_status.rc == 0
  changed_when: false

- name: "CloudInit: Parse existing template hash from metadata"
  ansible.builtin.set_fact:
    existing_sha512: "{{ (template_config.stdout | default('') | regex_findall('description: sha512-([a-f0-9]{128})') + ['missing']) | first }}"

- name: "CloudInit: Determine if provisioning is required"
  ansible.builtin.set_fact:
    provision_required: "{{ template_status.rc != 0 or existing_sha512 != upstream_sha512 }}"

- name: "CloudInit: Destroy outdated template due to upstream drift"
  ansible.builtin.command: qm destroy {{ template_vmid }} --destroy-unreferenced-disks 1 --purge 1
  when: template_status.rc == 0 and provision_required

- name: "CloudInit: State Drift Evaluation Result"
  ansible.builtin.debug:
    msg: >-
      {{
        '[STATE DRIFT DETECTED] Upstream image has changed or template is missing. Provisioning triggered.'
        if provision_required
        else '[STATE SYNCED] Local template matches upstream SHA-512 hash. Provisioning skipped.'
      }}

- name: "CloudInit: Download upstream image securely"
  ansible.builtin.get_url:
    url: "{{ template_upstream_base_url }}/{{ template_upstream_filename }}"
    dest: "/tmp/{{ template_upstream_filename }}"
    mode: '0644'
    checksum: "sha512:{{ upstream_sha512 }}"
  when: provision_required

- name: "CloudInit: Provision base VM and import disk atomically"
  ansible.builtin.command: >
    qm create {{ template_vmid }}
    --name "{{ template_vm_name }}"
    --memory {{ template_vm_memory }}
    --cores {{ template_vm_cores }}
    --cpu {{ template_vm_cpu_type }}
    --net0 virtio,bridge={{ template_vm_network_bridge }}
    --scsihw virtio-scsi-pci
    --scsi0 {{ template_storage_pool }}:0,import-from=/tmp/{{ template_upstream_filename }}
    --ide2 {{ template_storage_pool }}:cloudinit
    --boot c
    --bootdisk scsi0
    --serial0 socket
    --vga serial0
    --description "sha512-{{ upstream_sha512 }}"
    --agent 1
  when: provision_required

- name: "CloudInit: Convert VM to immutable Template"
  ansible.builtin.command: qm template {{ template_vmid }}
  when: provision_required

- name: "CloudInit: Clean up temporary image file"
  ansible.builtin.file:
    path: "/tmp/{{ template_upstream_filename }}"
    state: absent
  when: provision_required
