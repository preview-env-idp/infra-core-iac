---
# Checking for required variables and dependencies.
- name: "DevBox: Input Validation (Fail-Fast)"
  ansible.builtin.assert:
    that:
      - devbox_ip | length > 0
      - devbox_net_mask | length > 0
      - devbox_gw_ip | length > 0
      - devbox_ssh_pubkey | length > 0
      - devbox_template_name | string | length > 0
      - devbox_api_token_secret | length > 0
    fail_msg: |
      [CONFIGURATION FATAL] Missing required provisioning variables.
      Ensure 'devbox_ip', 'devbox_net_mask', 'devbox_gw_ip', 'devbox_ssh_pubkey', 
      'devbox_template_name', and 'devbox_api_token_secret' are explicitly defined.
    success_msg: "[CONFIGURATION OK] All mandatory variables present."
  delegate_to: localhost
  run_once: true

- name: "DevBox: Ensure Python REST dependencies exist on Ansible Controller"
  ansible.builtin.command: >
    {{ ansible_playbook_python }} -c 'import proxmoxer, requests'
  delegate_to: localhost
  become: false
  changed_when: false
  run_once: true
  ignore_errors: true
  register: python_deps_check
  check_mode: false

- name: "DevBox: Verify proxmoxer and requests are installed"
  ansible.builtin.assert:
    that: 
      - python_deps_check.rc == 0
    fail_msg: |
      [DEPENDENCY FATAL] The 'proxmoxer' and/or 'requests' Python libraries are missing in the active Python environment.
      Active interpreter: {{ ansible_playbook_python }}
      Ensure you are executing this role within the properly bootstrapped virtual environment (e.g., via 'make deps').
    quiet: true
  run_once: true

# Main provisioning tasks for the DevBox KVM instance.
- name: "DevBox: Dynamically fetch physical Proxmox node name"
  ansible.builtin.command: hostname
  delegate_to: "{{ inventory_hostname }}"
  register: pve_raw_hostname
  changed_when: false
  become: false
  check_mode: false

- name: "DevBox: Set resolved node name"
  ansible.builtin.set_fact:
    pve_node_hostname: "{{ pve_raw_hostname.stdout }}"

- name: "PVE API: Query cluster for existing VMs"
  ansible.builtin.uri:
    url: "https://{{ ansible_host }}:8006/api2/json/cluster/resources?type=vm"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ devbox_api_user }}!{{ devbox_api_token_id }}={{ devbox_api_token_secret }}"
    validate_certs: false
    return_content: true
  register: cluster_resources
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false

- name: "PVE API: Parse response to check if {{ devbox_name }} exists"
  ansible.builtin.set_fact:
    devbox_match: "{{ cluster_resources.json.data | selectattr('name', 'equalto', devbox_name) | list }}"

- name: "PVE API: Retrieve next available VMID from cluster if missing"
  ansible.builtin.uri:
    url: "https://{{ ansible_host }}:8006/api2/json/cluster/nextid"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ devbox_api_user }}!{{ devbox_api_token_id }}={{ devbox_api_token_secret }}"
    validate_certs: false
    return_content: true
  register: next_vmid_response
  delegate_to: localhost
  become: false
  changed_when: false
  when: devbox_match | length == 0
  check_mode: false

- name: "DevBox: Resolve final target VMID"
  ansible.builtin.set_fact:
    resolved_vmid: "{{ devbox_match[0].vmid if (devbox_match | length > 0) else next_vmid_response.json.data }}"

- name: "DevBox: Phase 1 - Clone KVM from Template (Run only if missing)"
  community.proxmox.proxmox_kvm:
    api_host: "{{ ansible_host }}"
    api_user: "{{ devbox_api_user }}"
    api_token_id: "{{ devbox_api_token_id }}"
    api_token_secret: "{{ devbox_api_token_secret }}"
    validate_certs: false
    node: "{{ pve_node_hostname }}"
    name: "{{ devbox_name }}"
    newid: "{{ resolved_vmid }}"
    clone: "{{ devbox_template_name }}"
    full: "{{ devbox_full_clone }}"
    state: present
  delegate_to: localhost
  become: false
  when: devbox_match | length == 0
  register: vm_clone_result

- name: "DevBox: Phase 2 - Configure KVM Instance via API"
  community.proxmox.proxmox_kvm:
    api_host: "{{ ansible_host }}"
    api_user: "{{ devbox_api_user }}"
    api_token_id: "{{ devbox_api_token_id }}"
    api_token_secret: "{{ devbox_api_token_secret }}"
    validate_certs: false
    node: "{{ pve_node_hostname }}"
    vmid: "{{ resolved_vmid }}"
    update: true
    cores: "{{ devbox_cores }}"
    memory: "{{ devbox_memory }}"
    agent: true
    scsihw: virtio-scsi-pci
    boot: c
    bootdisk: scsi0
    onboot: true
    ciuser: "{{ devbox_ci_user if (vm_clone_result.changed | default(false)) else omit}}"
    cipassword: "{{ devbox_ci_password | password_hash('sha512', devbox_ci_salt) if (vm_clone_result.changed | default(false)) else omit}}"
    net:
      net0: "virtio,bridge={{ devbox_net_bridge }}"
    ipconfig:
      ipconfig0: "ip={{ devbox_ip }}/{{ devbox_net_mask }},gw={{ devbox_gw_ip }}"
    sshkeys: "{{ devbox_ssh_pubkey }}"
    state: present
  delegate_to: localhost
  become: false

- name: "DevBox: Phase 3 - Start KVM Instance via API"
  community.proxmox.proxmox_kvm:
    api_host: "{{ ansible_host }}"
    api_user: "{{ devbox_api_user }}"
    api_token_id: "{{ devbox_api_token_id }}"
    api_token_secret: "{{ devbox_api_token_secret }}"
    validate_certs: false
    node: "{{ pve_node_hostname }}"
    vmid: "{{ resolved_vmid }}"
    state: started
  delegate_to: localhost
  become: false
