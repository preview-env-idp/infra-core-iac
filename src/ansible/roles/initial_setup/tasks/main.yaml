---
- name: "Security Gate: Enforce password and salt security requirements (driven by ADR-005)"
  ansible.builtin.assert:
    that:
      - vault_alcambic_password | default('') | length >= 32
      - vault_alcambic_password | default('') != 'PASTE_GENERATED_SALT_HERE'
      - vault_alcambic_salt | default('') | length >= 12
      - vault_alcambic_salt | default('') != 'PASTE_GENERATED_SALT_HERE'
    fail_msg: |
      {% if vault_alcambic_password | default('') == 'PASTE_GENERATED_SALT_HERE' %}
        [SECURITY FATAL] The vault_alcambic_password contains the default placeholder 'PASTE_GENERATED_SALT_HERE' and must be replaced with a real password.
      {% elif vault_alcambic_password | default('') | length < 32 %}
        [SECURITY FATAL] The vault_alcambic_password is less than 32 characters. This violates ADR-005 and renders the SHA-512 hash more vulnerable to GPU attacks.
      {% elif vault_alcambic_salt | default('') == 'PASTE_GENERATED_SALT_HERE' %}
        [SECURITY FATAL] The vault_alcambic_salt contains the default placeholder 'PASTE_GENERATED_SALT_HERE' and must be replaced with a generated salt.
      {% elif vault_alcambic_salt | default('') | length < 12 %}
        [SECURITY FATAL] The vault_alcambic_salt is less than 12 characters. This violates the minimum salt length security requirement.
      {% endif %}
    success_msg: "[SECURITY OK] Variables meets security requirements."

- name: "Local: Generate passphrase-less automation SSH key pair on localhost"
  community.crypto.openssh_keypair:
    path: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519_alcambic_m2m"
    type: ed25519
    comment: "alcambic-m2m-automation-key"
    state: present
  delegate_to: localhost
  become: no
  register: m2m_keypair

- name: "User Management: Ensure primary group exists"
  ansible.builtin.group:
    name: alcambic
    state: present

- name: "User Management: Create alcambic operational service account"
  ansible.builtin.user:
    name: alcambic
    group: alcambic
    groups: sudo
    append: yes
    shell: /bin/bash
    password: "{{ vault_alcambic_password | password_hash('sha512') }}"
    state: present
    create_home: yes

- name: "SSH: Deploy automation public key with exclusive lock"
  ansible.posix.authorized_key:
    user: alcambic
    state: present
    key: "{{ m2m_keypair.public_key }}"
    exclusive: yes
