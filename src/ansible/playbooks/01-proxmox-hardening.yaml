---
- name: Day-0 Proxmox VE Bootstrap
  hosts: proxmox_cluster
  remote_user: root
  become: no
  vars:
    ansible_ssh_private_key_file: ""

  roles:
    - initial_setup

- name: Day-0 Proxmox VE Configuration & Hardening
  hosts: proxmox_cluster

  roles:
    - secure_ssh
    - pve_firewall
    - networking
