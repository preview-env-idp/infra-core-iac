---
name: Makefile Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Validate Makefile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Warn about space indentation in Makefile
        run: |
          awk '/^ +(@|[a-zA-Z0-9-])/ { print "::warning file=Makefile,line=" NR "::Potential indentation issue: Makefile recipes must start with a tab, not spaces." }' Makefile

      - name: Install checkmake
        run: go install github.com/checkmake/checkmake/cmd/checkmake@latest

      - name: Run checkmake
        run: checkmake --config=.checkmake Makefile
